<!doctype html><html lang="en"><meta charset="utf-8"><title>YDA responsive preview</title><style>body{margin:0;padding:16px;background:#dedbe7;font:14px system-ui}header{margin-bottom:12px;display:flex;gap:8px;align-items:center}button{padding:8px 16px;border:0;border-radius:8px;background:#fff;cursor:pointer}iframe{border:0;background:white;box-shadow:0 2px 12px #0002}#check{color:#534564}</style><header><strong>Viewport:</strong><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><span id="check"></span></header><iframe id="phone" src="../index.html" width="390" height="844" title="Mobile title studio"></iframe><script>const f=document.getElementById('phone');for(const b of document.querySelectorAll('button'))b.onclick=()=>{f.width=b.dataset.width;setTimeout(check,100)};function check(){const d=f.contentDocument;document.getElementById('check').textContent=`Document: ${d.documentElement.scrollWidth} px / viewport ${f.contentWindow.innerWidth} px — ${d.documentElement.scrollWidth<=f.contentWindow.innerWidth?'no horizontal overflow':'OVERFLOW'}`;}f.onload=check;</script></html>
